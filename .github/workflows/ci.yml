name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A normal run takes under a minute; fail fast if something hangs.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ubuntu-latest already ships Chromium's system libraries. Skipping
      # --with-deps avoids apt, whose mirrors have been slow enough to stall CI.
      - run: npx playwright install chromium
        timeout-minutes: 5
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
