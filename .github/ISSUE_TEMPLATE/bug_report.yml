name: Bug report
description: honestlint crashed, hung, or behaved unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! If honestlint flagged something that is **not** a dark pattern, please use the "False positive" template instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the command you ran and the full output.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL (if public)
      description: A page we can use to reproduce the problem.
  - type: input
    id: version
    attributes:
      label: honestlint version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node.js version and OS
      placeholder: "Node 22, macOS 15"
    validations:
      required: true
