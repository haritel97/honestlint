name: False positive
description: honestlint flagged something that is not a dark pattern
labels: ["false positive"]
body:
  - type: markdown
    attributes:
      value: |
        False positives make a linter useless, so these reports are especially valuable. Thank you!
  - type: input
    id: rule
    attributes:
      label: Rule id
      placeholder: "pre-checked-consent"
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: The finding
      description: Paste the honestlint output for this finding.
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is this not deceptive?
    validations:
      required: true
  - type: textarea
    id: markup
    attributes:
      label: Minimal HTML (or a public URL)
      description: The smallest snippet that reproduces the false positive.
      render: html
