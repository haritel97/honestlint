<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Consent banner in an iframe</title>
  <style>iframe { border: 0; width: 600px; height: 160px; margin-top: 200px; }</style>
</head>
<body>
  <h1>News site</h1>
  <!-- Like many consent platforms, the banner is served in an iframe. -->
  <iframe title="Consent" srcdoc='
    <style>
      .accept { padding: 20px 60px; font-size: 20px; }
      .reject { padding: 2px; font-size: 10px; }
    </style>
    <p>We and our partners use cookies.</p>
    <button class="accept">Accept all</button>
    <a href="#" class="reject">Reject</a>
    <p><a href="#">No thanks, I don&#39;t want to stay informed</a></p>
  '></iframe>
</body>
</html>
